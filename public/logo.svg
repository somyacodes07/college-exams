<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Exam Scheduler">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="256" rx="116" fill="url(#shine)"/>

  <!-- Calendar body -->
  <rect x="112" y="132" width="288" height="268" rx="44" fill="#ffffff"/>
  <!-- Calendar header band -->
  <path d="M156 132h200a44 44 0 0 1 44 44v34H112v-34a44 44 0 0 1 44-44z" fill="#0b0f19"/>

  <!-- Binder rings -->
  <rect x="176" y="100" width="28" height="70" rx="14" fill="#0b0f19" stroke="#ffffff" stroke-width="10"/>
  <rect x="308" y="100" width="28" height="70" rx="14" fill="#0b0f19" stroke="#ffffff" stroke-width="10"/>

  <!-- Check mark -->
  <path d="M192 304l44 42 88-92" fill="none" stroke="#10b981" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
