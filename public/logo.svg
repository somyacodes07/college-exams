<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Exam Scheduler">
  <!-- Ink tile -->
  <rect width="512" height="512" rx="112" fill="#1c2a47"/>
  <!-- A date sheet: the next slot is highlighted, later ones fade -->
