  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (t === 'dark') document.documentElement.classList.add('dark');
    } catch (e) { document.documentElement.classList.add('dark'); }
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9010905957176372" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            // Check for service worker updates on every page visit
            registration.update();

            // When a new service worker is installing
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  // If installed and an active controller exists, a new build was deployed!
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New content is available; please refresh.');
                    // Removed window.location.reload() to prevent infinite refresh loops
                  }
                });
              }
            });
          })
          .catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });

      // Reload smoothly when the active worker changes
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('Service worker controller changed.');
        // Removed aggressive window.location.reload()
      });
    }
  </script>
</body>

</html>
